name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**/*'
      - 'launch-service/**/*'
      - 'launcher-core/**/*'
      - 'launcher-gtk/**/*'
      - 'Cargo.*'
      - 'build.rs'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**/*'
      - 'launch-service/**/*'
      - 'launcher-core/**/*'
      - 'launcher-gtk/**/*'
      - 'Cargo.*'
      - 'build.rs'
      - '.github/workflows/build.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-Dwarnings'

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    name: 'Formatting'
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --check

      - name: Check launch service formatting
        run: cargo fmt --manifest-path launch-service/Cargo.toml --check

  clippy-base:
    runs-on: ubuntu-latest
    container: ghcr.io/jakestanger/ironbar-build:master
    name: 'Clippy (Base features)'
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        name: Cache dependencies

      - name: Clippy
        run: cargo clippy --no-default-features --features config+json
        env:
          # Allow some warnings through as we'll never get it perfect in a zero-feature situation
          RUSTFLAGS: '-Dwarnings -A unused-imports -A unused-variables -A unused-mut -A unused-macros -A dead-code'


  clippy-all:
    runs-on: ubuntu-latest
    container: ghcr.io/jakestanger/ironbar-build:master
    name: 'Clippy (All features)'
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        name: Cache dependencies

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Clippy launch service
        run: cargo clippy --manifest-path launch-service/Cargo.toml --all-targets

  build:
    name: 'Build & Test'
    runs-on: ubuntu-latest
    container: ghcr.io/jakestanger/ironbar-build:master

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        name: Cache dependencies

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test

  launcher:
    name: 'Launcher crates'
    runs-on: ubuntu-latest
    container: ghcr.io/jakestanger/ironbar-build:master

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        name: Cache dependencies

      - name: Clippy
        run: >-
          cargo clippy -p ironbar-launch-service -p cbar-launcher-core
          -p cbar-launcher --all-targets -- -D warnings

      - name: Run tests
        run: >-
          cargo test -p ironbar-launch-service -p cbar-launcher-core
          -p cbar-launcher --all-targets

      - name: Verify launch service package
        run: cargo package --manifest-path launch-service/Cargo.toml --allow-dirty

      - name: Verify launcher core package
        run: cargo package --manifest-path launcher-core/Cargo.toml --allow-dirty

      - name: Verify launcher GTK package
        run: >-
          cargo package --manifest-path launcher-gtk/Cargo.toml --allow-dirty
          --config "patch.crates-io.cbar-launcher-core.path='${GITHUB_WORKSPACE}/launcher-core'"
          --config "patch.crates-io.ironbar-launch-service.path='${GITHUB_WORKSPACE}/launch-service'"

      - name: Verify root package with staged launcher crates
        run: >-
          cargo package --allow-dirty
          --config "patch.crates-io.cbar-launcher.path='${GITHUB_WORKSPACE}/launcher-gtk'"
          --config "patch.crates-io.cbar-launcher-core.path='${GITHUB_WORKSPACE}/launcher-core'"
          --config "patch.crates-io.ironbar-launch-service.path='${GITHUB_WORKSPACE}/launch-service'"

  feature-checks:
    name: 'Check feature flag'
    runs-on: ubuntu-latest
    container: ghcr.io/jakestanger/ironbar-build:master

    strategy:
      fail-fast: false
      matrix:
        feature:
          - http
          - ipc
          - inhibit
          - cli
          - config+all
          - config+json
          - config+yaml
          - config+toml
          - config+corn
          - battery
          - bindmode+all
          - bindmode+sway
          - bindmode+hyprland
          - bluetooth
          - cairo
          - clipboard
          - clock
          - custom
          - focused
          - keyboard+all
          - keyboard+sway
          - keyboard+hyprland
          - label
          - launcher
          - matrix_launcher
          - menu
          - music+all
          - music+mpris
          - music+mpd
          - network_manager
          - notifications
          - sys_info
          - script
          - system_graph
          - tray
          - volume
          - workspaces+all
          - workspaces+sway
          - workspaces+hyprland
          - workspaces+niri
          - extras

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        name: Cache dependencies

      - name: Check
        run: cargo check --no-default-features --features ${{ matrix.feature }}
        env:
          # Allow some warnings through as we'll never get it perfect
          RUSTFLAGS: '-Dwarnings -A unused-imports -A unused-variables -A unused-mut -A unused-macros -A dead-code'

  build-nix:
    runs-on: ubuntu-latest
    name: Build (Nix)

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: jakestanger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build
        run: nix build
